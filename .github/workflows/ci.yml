name: Tests, build and PyPI

on:
  push:
    branches: [develop, main, 'feature/**', 'release/**', 'hotfix/**']
    tags: ['v*']
  pull_request:
    branches: [develop, main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest --cov=petrovich --cov-branch --cov-fail-under=90 --cov-report=term-missing
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7'
      - run: python scripts/ci_version.py
        env:
          CI_COMMIT_BRANCH: ${{ github.head_ref || (github.ref_type == 'branch' && github.ref_name) || '' }}
          CI_COMMIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          CI_PIPELINE_IID: ${{ github.run_number }}
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check installed wheel
        run: |
          python -m venv /tmp/petrovich-wheel
          /tmp/petrovich-wheel/bin/pip install dist/*.whl
          /tmp/petrovich-wheel/bin/python -I -m petrovich rules validate
          /tmp/petrovich-wheel/bin/python -I -c "from petrovich import Petrovich, Case; assert Petrovich().firstname('Иван', Case.GENITIVE) == 'Ивана'"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && github.ref_protected
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/Petrovich/
    concurrency: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
